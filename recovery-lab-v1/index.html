<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Recovery Lab</title><style>body{font:16px system-ui;max-width:720px;margin:24px auto;padding:0 16px;color:#172235}button{padding:12px 16px;margin:6px;background:#142b4a;color:white;border:0;border-radius:9px;font-weight:700}pre{white-space:pre-wrap;background:#f2f4f7;padding:14px;border-radius:9px}small{color:#657286}</style><h1>The Handyman Accountancy — Recovery Lab</h1><p><b>Isolated test only.</b> This page uses dedicated test keys and a separate IndexedDB database. It does not access production app records.</p><button id="run">Run recovery tests</button><button id="recover">Recover pending test</button><pre id="out">Ready.</pre><small>Test keys: tha_recovery_lab_v1_* · IndexedDB: tha_recovery_lab_v1</small><script>
'use strict';
const P='tha_recovery_lab_v1_',K=[P+'a',P+'p',P+'c'],D='tha_recovery_lab_v1',S='journal',out=document.getElementById('out');let log=[];
function say(x){log.push(x);out.textContent=log.join('\n')}
function db(){return new Promise((ok,no)=>{let r=indexedDB.open(D,1);r.onupgradeneeded=()=>r.result.createObjectStore(S);r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})}
async function journal(v,del=false){let d=await db();await new Promise((ok,no)=>{let t=d.transaction(S,'readwrite'),s=t.objectStore(S);del?s.delete('j'):s.put(v,'j');t.oncomplete=ok;t.onerror=()=>no(t.error);t.onabort=()=>no(t.error||Error('Journal transaction aborted'))});d.close()}
async function get(){let d=await db(),v=await new Promise((ok,no)=>{let r=d.transaction(S).objectStore(S).get('j');r.onsuccess=()=>ok(r.result||null);r.onerror=()=>no(r.error)});d.close();return v}
const read=()=>Object.fromEntries(K.map(k=>[k,localStorage.getItem(k)]));
function write(k,v){if(v===null)localStorage.removeItem(k);else localStorage.setItem(k,v);if(localStorage.getItem(k)!==v)throw Error('Read-back mismatch '+k)}
function verify(v){K.forEach(k=>{if(localStorage.getItem(k)!==v[k])throw Error('Mismatch '+k)})}
async function recover(){let j=await get();if(!j)return 'No pending journal';if(j.phase!=='committed'){K.forEach(k=>write(k,j.old[k]));verify(j.old);say('PASS: pending operation rolled back; absent keys restored as absent')}else say('Committed values retained');await journal(null,true);return 'Recovery check complete'}
async function apply(next,fail=0,interrupt=false){let old=read(),j={schema:1,phase:'prepared',old};await journal(j);let v=await get();if(!v||JSON.stringify(v.old)!==JSON.stringify(old))throw Error('Journal read-back failed');j.phase='applying';await journal(j);try{for(let i=0;i<K.length;i++){if(fail===i+1)throw Error('Injected write failure '+(i+1));write(K[i],next[K[i]]);if(interrupt&&i===0)return}verify(next);j.phase='committed';await journal(j);await journal(null,true)}catch(e){K.forEach(k=>write(k,old[k]));verify(old);await journal(null,true);throw e}}
document.getElementById('recover').onclick=async()=>{try{say(await recover())}catch(e){say('FAIL '+e.message)}};
document.getElementById('run').onclick=async()=>{log=[];try{await recover();const baseline=read();let old={},next={};K.forEach((k,i)=>{old[k]=JSON.stringify({state:'old',i});next[k]=JSON.stringify({state:'new',i});write(k,old[k])});await apply(next);verify(next);say('PASS: successful write, read-back and commit');K.forEach(k=>write(k,old[k]));try{await apply(next,2)}catch(e){if(!e.message.includes('Injected'))throw e}verify(old);say('PASS: injected write failure rolled back all keys');K.forEach(k=>write(k,old[k]));await apply(next,0,true);if((await get()).phase!=='applying')throw Error('Pending journal missing');say('PASS: interrupted operation left durable journal');await recover();verify(old);say('PASS: interrupted operation recovered after reload-equivalent startup check');K.forEach((k,i)=>{if(i===1)localStorage.removeItem(k);else write(k,old[k])});const sparse=read();if(sparse[K[1]]!==null)throw Error('Sparse-state setup failed');await apply(next,0,true);await recover();verify(sparse);if(localStorage.getItem(K[1])!==null)throw Error('Previously absent key was not removed');say('PASS: rollback preserves absent keys (null) exactly');K.forEach(k=>{if(baseline[k]===null)localStorage.removeItem(k);else write(k,baseline[k])});say('ALL TESTS PASSED — production keys were not accessed')}catch(e){say('FAIL: '+e.message)}};
(async()=>{try{let j=await get();if(j&&j.phase!=='committed')await recover()}catch(e){say('Startup recovery error: '+e.message)}})();
</script></html>
