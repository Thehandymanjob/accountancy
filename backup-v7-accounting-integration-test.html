<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Accounting Backup v7 — Integration Simulation</title><style>body{font:16px system-ui;max-width:850px;margin:28px auto;padding:0 18px;color:#222}button{padding:14px 20px;font:inherit;font-weight:700;border:0;border-radius:10px;background:#ddd}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f2f3f5;padding:18px;border-radius:12px;line-height:1.5}</style></head><body><h1>Accounting Backup v7 — Integration Simulation</h1><p>This simulates the app's Accounting data shape and the post-restore in-memory refresh. All storage is an in-memory mock. It does not access browser LocalStorage, Projects, Company, Contracts, or production data.</p><button id="run">Run integration simulation</button><pre id="output">Ready.</pre><script>
/* The Handyman Accountancy — isolated Accounting-only Backup v7
 * Scope: accounting DB object and invoice sequence only.
 * Does not read or write Projects, Company, Contracts, business profile, or browser app data during tests.
 */
(function(root){
'use strict';
const APP='The Handyman Accountancy';
const SCHEMA=7;
const ACCOUNTING_KEY='tha_v212_migration_accounting_v1';
const SEQUENCE_KEY='tha_v212_migration_invoice_sequence_v1';
const RECOVERY_KEY='tha_accounting_backup_v7_recovery_v1';
const own=(o,k)=>Object.prototype.hasOwnProperty.call(o,k);
function canonical(v){
 if(v===null||typeof v!=='object')return JSON.stringify(v);
 if(Array.isArray(v))return '['+v.map(x=>canonical(x)??'null').join(',')+']';
 return '{'+Object.keys(v).sort().map(k=>JSON.stringify(k)+':'+(canonical(v[k])??'null')).join(',')+'}';
}
async function digest(v){
 if(!root.crypto||!root.crypto.subtle||typeof TextEncoder==='undefined')throw new Error('SHA-256 unavailable; backup cancelled.');
 const bytes=new TextEncoder().encode(canonical(v));
 const hash=await root.crypto.subtle.digest('SHA-256',bytes);
 return Array.from(new Uint8Array(hash),b=>b.toString(16).padStart(2,'0')).join('');
}
function parseAccounting(raw){
 if(raw===null)throw new Error('Accounting data is absent; backup cancelled.');
 let v;try{v=JSON.parse(raw)}catch(_){throw new Error('Accounting data is not valid JSON; original data left untouched.')}
 if(!v||typeof v!=='object'||Array.isArray(v)||
 !Array.isArray(v.entries)||!Array.isArray(v.customers)||!Array.isArray(v.invoices)||
 !v.settings||typeof v.settings!=='object'||Array.isArray(v.settings))
 throw new Error('Accounting data has an unexpected structure; backup cancelled.');
 if(v.customExpenseCategories!==undefined&&!Array.isArray(v.customExpenseCategories))
 throw new Error('Custom expense categories are invalid; backup cancelled.');
 return v;
}
function sequenceValue(raw){
 if(raw===null||raw==='')return 0;
 const n=Number(raw);if(!Number.isSafeInteger(n)||n<0)throw new Error('Invoice sequence is invalid.');
 return n;
}
async function buildBackup(storage,version){
 const accounting=parseAccounting(storage.getItem(ACCOUNTING_KEY));
 const sequence=sequenceValue(storage.getItem(SEQUENCE_KEY));
 const data={accounting,invoiceSequence:sequence};
 const integrity={accounting:await digest(accounting),invoiceSequence:await digest(sequence)};
 const payload={app:APP,backupType:'accounting-only',backupSchemaVersion:SCHEMA,appVersion:String(version||'unknown'),createdAt:new Date().toISOString(),data,integrity};
 const serialized=JSON.stringify(payload,null,2);
 const copy=JSON.parse(serialized);
 if(await digest(copy.data.accounting)!==copy.integrity.accounting||await digest(copy.data.invoiceSequence)!==copy.integrity.invoiceSequence)throw new Error('Backup verification failed.');
 return {payload:copy,serialized};
}
async function validateBackup(p){
 if(!p||typeof p!=='object'||Array.isArray(p)||p.app!==APP||p.backupType!=='accounting-only'||p.backupSchemaVersion!==SCHEMA||!p.data||!p.integrity||!own(p.data,'accounting')||!own(p.data,'invoiceSequence'))throw new Error('Unsupported or invalid Accounting Backup v7.');
 parseAccounting(JSON.stringify(p.data.accounting));
 if(!Number.isSafeInteger(p.data.invoiceSequence)||p.data.invoiceSequence<0)throw new Error('Invoice sequence is invalid.');
 if(await digest(p.data.accounting)!==p.integrity.accounting||await digest(p.data.invoiceSequence)!==p.integrity.invoiceSequence)throw new Error('Backup integrity check failed.');
 return true;
}
async function restoreBackup(p,storage,confirmFn){
 await validateBackup(p);
 if(typeof confirmFn!=='function'||!confirmFn('Restore Accounting only? Accounting records, customers, invoices and settings will be replaced. Projects and other sections will not be changed.'))return {restored:false,reason:'cancelled'};
 if(storage.getItem(RECOVERY_KEY)!==null)throw new Error('An existing Accounting recovery snapshot exists. Preserve it and resolve it before another restore.');
 const oldAccounting=storage.getItem(ACCOUNTING_KEY),oldSequence=storage.getItem(SEQUENCE_KEY);
 const recoveryText=JSON.stringify({schema:1,createdAt:new Date().toISOString(),accounting:oldAccounting,invoiceSequence:oldSequence});
 storage.setItem(RECOVERY_KEY,recoveryText);
 if(storage.getItem(RECOVERY_KEY)!==recoveryText)throw new Error('Recovery snapshot verification failed; restore stopped before changing data.');
 let commit=false;
 try{
  commit=true;
  storage.setItem(ACCOUNTING_KEY,JSON.stringify(p.data.accounting));
  storage.setItem(SEQUENCE_KEY,String(Math.max(sequenceValue(oldSequence),p.data.invoiceSequence)));
  if(canonical(parseAccounting(storage.getItem(ACCOUNTING_KEY)))!==canonical(p.data.accounting))throw new Error('Accounting read-back verification failed.');
  if(sequenceValue(storage.getItem(SEQUENCE_KEY))!==Math.max(sequenceValue(oldSequence),p.data.invoiceSequence))throw new Error('Invoice sequence read-back verification failed.');
  return {restored:true,recoveryKey:RECOVERY_KEY,note:'Recovery snapshot retained until separately verified.'};
 }catch(err){
  let rollbackOK=true;
  if(commit){
   try{
    if(oldAccounting===null)storage.removeItem(ACCOUNTING_KEY);else storage.setItem(ACCOUNTING_KEY,oldAccounting);
    if(oldSequence===null)storage.removeItem(SEQUENCE_KEY);else storage.setItem(SEQUENCE_KEY,oldSequence);
    if(storage.getItem(ACCOUNTING_KEY)!==oldAccounting||storage.getItem(SEQUENCE_KEY)!==oldSequence)throw new Error('Rollback read-back failed.');
   }catch(_){rollbackOK=false;}
  }
  if(rollbackOK){try{storage.removeItem(RECOVERY_KEY)}catch(_){}throw new Error('Restore failed; previous Accounting data rollback was verified. '+err.message);}
  throw new Error('CRITICAL: Accounting restore and rollback could not be verified. Keep '+RECOVERY_KEY+' and do not clear browser storage. '+err.message);
 }
}
async function exportToDownload(storage,version){
 const result=await buildBackup(storage,version);
 const blob=new Blob([result.serialized],{type:'application/json'});
 const url=URL.createObjectURL(blob),a=document.createElement('a');
 a.href=url;a.download='The_Handyman_Accounting_Backup_v7_'+new Date().toISOString().slice(0,10)+'.json';
 document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000);
 return {initiated:true,verified:true};
}
root.HandymanAccountingBackupV7=Object.freeze({schemaVersion:SCHEMA,keys:Object.freeze({accounting:ACCOUNTING_KEY,invoiceSequence:SEQUENCE_KEY,recovery:RECOVERY_KEY}),buildBackup,validateBackup,restoreBackup,exportToDownload});
})(typeof window!=='undefined'?window:globalThis);

</script><script>
(function(){
'use strict';
const out=document.getElementById('output');
function assert(x,m){if(!x)throw new Error(m)}
function mock(seed){const d=Object.assign({},seed||{});return{getItem:k=>Object.prototype.hasOwnProperty.call(d,k)?d[k]:null,setItem:(k,v)=>{d[k]=String(v)},removeItem:k=>{delete d[k]}}}
function appNormalize(parsed){
 return {...{entries:[],customers:[],invoices:[],customExpenseCategories:[],settings:{businessName:'',ownerName:''}},...parsed,
 customers:Array.isArray(parsed.customers)?parsed.customers:[],
 invoices:Array.isArray(parsed.invoices)?parsed.invoices:[],
 customExpenseCategories:Array.isArray(parsed.customExpenseCategories)?parsed.customExpenseCategories.filter(x=>typeof x==='string'&&x.trim()):[],
 settings:{businessName:'',ownerName:'',...(parsed.settings||{})}};
}
document.getElementById('run').addEventListener('click',async()=>{
 const lines=[],pass=x=>lines.push('PASS  '+x);
 try{
  const api=window.HandymanAccountingBackupV7,K=api.keys;
  const appDb={entries:[{id:'A-1',type:'income',amount:225}],customers:[{id:'C-1',name:'Test Customer'}],invoices:[{id:'INV-1',customerId:'C-1'}],customExpenseCategories:['Special'],settings:{businessName:'Test Builder',ownerName:'Synthetic'}};
  const storage=mock({[K.accounting]:JSON.stringify(appDb),[K.invoiceSequence]:'777'});
  const exported=await api.buildBackup(storage,'TEST-APP');
  assert(JSON.stringify(exported.payload.data.accounting)===JSON.stringify(appDb),'App accounting shape changed during export');
  pass('App DB shape is preserved exactly in export');
  const targetDb={entries:[],customers:[],invoices:[],customExpenseCategories:[],settings:{businessName:'',ownerName:''}};
  const target=mock({[K.accounting]:JSON.stringify(targetDb),[K.invoiceSequence]:'800'});
  await api.restoreBackup(exported.payload,target,()=>true);
  const parsed=JSON.parse(target.getItem(K.accounting));
  const refreshedDb=appNormalize(parsed);
  assert(refreshedDb.entries.length===1&&refreshedDb.customers[0].id==='C-1'&&refreshedDb.invoices[0].customerId==='C-1','App runtime normalization failed');
  assert(refreshedDb.customExpenseCategories[0]==='Special'&&refreshedDb.settings.businessName==='Test Builder','Optional app fields not retained');
  pass('Restore result can be reloaded using app loadDB normalization');
  assert(target.getItem(K.invoiceSequence)==='800','High-water invoice sequence regressed');
  pass('App shared invoice sequence high-water mark is preserved');
  assert(target.getItem(K.recovery)!==null,'Pre-restore recovery snapshot not retained');
  pass('Pre-restore recovery snapshot retained for manual verification');
  out.textContent=lines.join('\\n')+'\\n\\nIntegration simulation passed. It did not access real browser storage.';
 }catch(e){out.textContent=lines.join('\\n')+'\\nFAIL  '+e.message+'\\n\\nNo real browser storage was accessed.'}
});
})();
</script></body></html>
