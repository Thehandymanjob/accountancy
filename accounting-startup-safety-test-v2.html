<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Accounting Startup Safety Tests v2</title>
<style>body{font:17px system-ui;max-width:760px;margin:32px auto;padding:0 18px}button{font:700 18px system-ui;padding:16px;border:0;border-radius:14px;color:#2563eb;background:#e5e5e5}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f1f2f4;padding:22px;border-radius:18px;font:16px ui-monospace}</style></head>
<body><h1>Accounting Startup Safety Tests v2</h1>
<p>Isolated synthetic test only. No browser LocalStorage, live app data, Projects, Company, Contracts, or index.html are accessed.</p>
<button id="run">Run startup safety tests</button><pre id="out">Not run.</pre>
<script src="accounting-startup-safety-v2.js"></script>
<script>
document.getElementById('run').onclick=()=>{
 const lines=[];let passed=0;
 const test=(name,fn)=>{try{fn();lines.push('PASS  '+name);passed++}catch(e){lines.push('FAIL  '+name+' — '+e.message)}};
 test('Inspection identifies pending work without mutating Accounting',()=>{
  const db={entries:[{id:'a',type:'income',date:'2026-01-01'},{id:'orphan',type:'income',reference:'Invoice 200'}],invoices:[],settings:{}};
  const before=JSON.stringify(db),p=HandymanAccountingStartupSafety.inspect(db);
  if(!p.changesRequired||p.unnumberedIncomeCount!==2||p.orphanInvoiceIncomeIds[0]!=='orphan'||JSON.stringify(db)!==before)
   throw Error('changesRequired='+p.changesRequired+', unnumbered='+p.unnumberedIncomeCount+', orphanIds='+JSON.stringify(p.orphanInvoiceIncomeIds)+', unchanged='+(JSON.stringify(db)===before));
 });
 test('Normal income is not classified as an orphan',()=>{
  const db={entries:[{id:'x',type:'income',reference:'Customer payment'}],invoices:[]};
  if(HandymanAccountingStartupSafety.inspect(db).orphanInvoiceIncomeIds.length)throw Error('Generic income was flagged');
 });
 test('Missing explicit approval blocks all changes',()=>{
  const db={entries:[{id:'a',type:'income'}],invoices:[]},before=JSON.stringify(db),p=HandymanAccountingStartupSafety.inspect(db);
  let rejected=false;try{HandymanAccountingStartupSafety.apply(db,p,{})}catch(e){rejected=true}
  if(!rejected||JSON.stringify(db)!==before)throw Error('Unapproved migration changed data');
 });
 test('Explicitly approved migration numbers income and removes only identified orphan',()=>{
  const db={entries:[{id:'a',type:'income',date:'2026-01-01'},{id:'o',type:'income',reference:'Invoice 999'}],invoices:[{number:246}]};
  const p=HandymanAccountingStartupSafety.inspect(db),r=HandymanAccountingStartupSafety.apply(db,p,{explicitApproval:true});
  if(r.numberedIncome!==1||r.removedOrphans!==1||db.entries.length!==1||db.entries[0].number!==247)
   throw Error('result='+JSON.stringify(r)+', entries='+JSON.stringify(db.entries));
 });
 document.getElementById('out').textContent=lines.join(String.fromCharCode(10))+String.fromCharCode(10,10)+passed+'/4 tests passed. Synthetic in-memory data only.';
};
</script></body></html>
