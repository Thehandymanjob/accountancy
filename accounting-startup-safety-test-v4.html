<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Accounting Startup Safety Tests v4</title><style>body{font:17px system-ui;max-width:760px;margin:32px auto;padding:0 18px}button{font:700 18px system-ui;padding:16px;border:0;border-radius:14px;color:#2563eb;background:#e5e5e5}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f1f2f4;padding:22px;border-radius:18px;font:16px ui-monospace}</style></head><body><h1>Accounting Startup Safety Tests v4</h1><p>Isolated synthetic test only. No browser LocalStorage, live app data, Projects, Company, Contracts, or index.html are accessed. Saved sequence values are supplied as synthetic inputs.</p><button id="run">Run startup safety tests</button><pre id="out">Not run.</pre><script src="accounting-startup-safety-v4.js"></script><script>
document.getElementById('run').onclick=()=>{const lines=[];let passed=0;const test=(n,f)=>{try{f();lines.push('PASS  '+n);passed++}catch(e){lines.push('FAIL  '+n+' — '+e.message)}};
test('Inspection identifies pending work without mutating Accounting',()=>{const db={entries:[{id:'a',type:'income',date:'2026-01-01'},{id:'orphan',type:'income',reference:'Invoice 200'}],invoices:[],settings:{}};const before=JSON.stringify(db),p=HandymanAccountingStartupSafety.inspect(db);if(!p.changesRequired||p.unnumberedIncomeCount!==2||p.orphanInvoiceIncomeIds[0]!=='orphan'||JSON.stringify(db)!==before)throw Error('Inspection mutated data or missed a candidate')});
test('Normal income is not classified as an orphan',()=>{const db={entries:[{id:'x',type:'income',reference:'Customer payment'}],invoices:[]};if(HandymanAccountingStartupSafety.inspect(db).orphanInvoiceIncomeIds.length)throw Error('Generic income was flagged')});
test('Missing explicit approval blocks all changes',()=>{const db={entries:[{id:'a',type:'income'}],invoices:[]},before=JSON.stringify(db),p=HandymanAccountingStartupSafety.inspect(db);let rejected=false;try{HandymanAccountingStartupSafety.apply(db,p,{})}catch(e){rejected=true}if(!rejected||JSON.stringify(db)!==before)throw Error('Unapproved migration changed data')});
test('Stale inspection plan is rejected after Accounting data changes',()=>{const db={entries:[{id:'a',type:'income'}],invoices:[]},p=HandymanAccountingStartupSafety.inspect(db);db.entries.push({id:'b',type:'income'});const before=JSON.stringify(db);let rejected=false;try{HandymanAccountingStartupSafety.apply(db,p,{explicitApproval:true})}catch(e){rejected=/changed after inspection/.test(e.message)}if(!rejected||JSON.stringify(db)!==before)throw Error('Stale plan was not safely rejected')});
test('Saved invoice sequence is included in numbering high-water mark',()=>{const db={entries:[{id:'a',type:'income'}],invoices:[{number:246}]},p=HandymanAccountingStartupSafety.inspect(db,500),r=HandymanAccountingStartupSafety.apply(db,p,{explicitApproval:true});if(db.entries[0].number!==501||r.nextSequence!==501)throw Error('Expected income 501 and nextSequence 501; got '+db.entries[0].number+' / '+r.nextSequence)});
test('Existing record number above saved sequence is never reduced',()=>{const db={entries:[{id:'a',type:'income',number:700},{id:'b',type:'income'}],invoices:[{number:650}]},p=HandymanAccountingStartupSafety.inspect(db,600),r=HandymanAccountingStartupSafety.apply(db,p,{explicitApproval:true});if(db.entries[1].number!==701||r.nextSequence!==701)throw Error('Sequence regressed or failed to advance')});
test('Invalid saved invoice sequence is rejected',()=>{const db={entries:[],invoices:[]};let rejected=false;try{HandymanAccountingStartupSafety.inspect(db,-1)}catch(e){rejected=true}if(!rejected)throw Error('Negative sequence was accepted')});
test('Approved migration numbers income and removes only identified orphan',()=>{const db={entries:[{id:'a',type:'income',date:'2026-01-01'},{id:'o',type:'income',reference:'Invoice 999'}],invoices:[{number:246}]};const p=HandymanAccountingStartupSafety.inspect(db),r=HandymanAccountingStartupSafety.apply(db,p,{explicitApproval:true});if(r.numberedIncome!==1||r.removedOrphans!==1||db.entries.length!==1||db.entries[0].number!==247)throw Error('Approved migration result incorrect')});
document.getElementById('out').textContent=lines.join(String.fromCharCode(10))+String.fromCharCode(10,10)+passed+'/8 tests passed. Synthetic in-memory data only.';};
</script></body></html>
