<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Handyman Accountancy — Isolated Restore Test v217</title>
<style>
html,body{margin:0;min-height:100%;font:16px system-ui;color:#172235;background:#f3f5f8}
#gate{position:relative;z-index:10;max-width:760px;margin:18px auto;padding:18px;background:#fff;border:1px solid #dce2ea;border-radius:16px;box-shadow:0 4px 20px #142b4a12}
h1{font-size:20px;margin:0 0 12px}p{line-height:1.5;color:#526176;margin:8px 0}.warning{color:#9a2c20;font-weight:700}
#status{white-space:pre-wrap;overflow-wrap:anywhere;font-size:13px;line-height:1.4;background:#f2f5f9;padding:12px;border-radius:9px}
#app{display:block;position:fixed;inset:0;width:100vw;height:100dvh;border:0;z-index:1;background:#f3f5f8}
#gate.good{display:none}
</style></head><body>
<section id="gate"><h1>The Handyman Accountancy — Isolated Restore Test v217</h1>
<p>This isolated test checks whether the actual launcher is visible. It does not use live app storage and does not alter accounting records.</p>
<p id="status">Checking recovery journal before app launch…</p>
<p class="warning">TEST ONLY — Do not enter business records.</p></section>
<iframe id="app" title="Isolated accountancy test app"></iframe>
<script>
'use strict';
(async()=>{
 const status=document.getElementById('status'),gate=document.getElementById('gate'),frame=document.getElementById('app');
 const DB='tha_restore_test_v1_recovery',STORE='restoreJournal',keys=['tha_restore_test_v1_accounting_v1','tha_restore_test_v1_projects_v1','tha_restore_test_v1_contracts_v1'];
 function openDB(){return new Promise((ok,no)=>{let settled=false;const finish=(fn,v)=>{if(settled)return;settled=true;clearTimeout(timer);fn(v)};const timer=setTimeout(()=>finish(no,Error('IndexedDB open timed out after 8 seconds')),8000);let r;try{if(!window.indexedDB)throw Error('IndexedDB unavailable');r=indexedDB.open(DB,1)}catch(e){finish(no,e);return}r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains(STORE))r.result.createObjectStore(STORE)};r.onsuccess=()=>finish(ok,r.result);r.onerror=()=>finish(no,r.error||Error('IndexedDB open failed'));r.onblocked=()=>finish(no,Error('IndexedDB open blocked'))})}
 async function readJournal(){const d=await openDB();try{return await new Promise((ok,no)=>{const t=d.transaction(STORE,'readonly'),r=t.objectStore(STORE).get('active');r.onsuccess=()=>ok(r.result||null);r.onerror=()=>no(r.error||Error('Journal read failed'))})}finally{d.close()}}
 async function clearJournal(){const d=await openDB();try{await new Promise((ok,no)=>{const t=d.transaction(STORE,'readwrite');t.objectStore(STORE).delete('active');t.oncomplete=ok;t.onerror=()=>no(t.error||Error('Journal clear failed'))})}finally{d.close()}}
 function write(k,v){if(v===null)localStorage.removeItem(k);else localStorage.setItem(k,v);if(localStorage.getItem(k)!==v)throw Error('Rollback verification failed: '+k)}
 function inspect(){
  try{
   const d=frame.contentDocument;if(!d)throw Error('iframe document is inaccessible');
   const win=d.defaultView,ids=['appLauncher','launcherName','projectsApp','contractsApp'];
   const lines=['iframe URL: '+frame.src,'document readyState: '+d.readyState,'app version: '+(d.querySelector('meta[name="app-version"]')?.content||'MISSING'),'body classes: '+d.body.className,'body text length: '+(d.body.innerText||'').trim().length];
   ids.forEach(id=>{const el=d.getElementById(id);if(!el){lines.push(id+': MISSING');return}const c=win.getComputedStyle(el),r=el.getBoundingClientRect();lines.push(id+': display='+c.display+', visibility='+c.visibility+', opacity='+c.opacity+', rect='+[Math.round(r.x),Math.round(r.y),Math.round(r.width),Math.round(r.height)].join('x'))});
   const launcher=d.getElementById('appLauncher'),brand=launcher&&launcher.querySelector('.launcher-brand'),buttons=launcher&&launcher.querySelectorAll('.launcher-action');
   const box=el=>{if(!el)return false;const c=win.getComputedStyle(el),r=el.getBoundingClientRect();return c.display!=='none'&&c.visibility!=='hidden'&&Number(c.opacity)>0&&r.width>30&&r.height>25};
   const visible=box(launcher)&&box(brand)&&buttons&&buttons.length>=3&&[...buttons].slice(0,3).every(box);
   const restoreText=typeof win.restore==='function'?Function.prototype.toString.call(win.restore):'';
   const restoreReady=restoreText.includes('TEST RESTORE SUCCESSFUL')&&restoreText.includes('IndexedDB pre-restore snapshot')&&restoreText.includes('isolated v217 test app only');
   const expectedKeys=['tha_restore_test_v1_accounting_v1','tha_restore_test_v1_projects_v1','tha_restore_test_v1_contracts_v1','tha_restore_test_v1_restore_recovery_v1','tha_restore_test_v1_factory_reset_recovery_v1'];
   const actualKeys=win.HandymanStorageFoundation&&Array.isArray(win.HandymanStorageFoundation.legacyKeys)?win.HandymanStorageFoundation.legacyKeys:[];
   const foundationReady=expectedKeys.every(k=>actualKeys.includes(k));
   const productionKeyIsolation=!restoreText.includes('tha_v206_')&&!restoreText.includes('handyman_accounting_v2');
   lines.push('launcher title visible: '+box(d.getElementById('launcherName')));
   lines.push('visible action buttons: '+(buttons?[...buttons].filter(box).length:0));
   lines.push('isolated restore override: '+(restoreReady?'LOADED':'MISSING / WRONG VERSION'));
   lines.push('storage foundation key map: '+(foundationReady?'MATCHED':'MISMATCH'));
   lines.push('restore production-key isolation: '+(productionKeyIsolation?'PASS':'FAIL'));
   const ready=visible&&restoreReady&&foundationReady&&productionKeyIsolation;
   lines.push('RESULT: '+(ready?'TEST APP RUNTIME CHECKS PASSED':'TEST APP RUNTIME CHECKS FAILED'));
   if(ready){status.textContent=lines.join('\n');gate.classList.add('good')}
   else{status.textContent='TEST APP INCOMPLETE / VISIBILITY FAILURE\n'+lines.join('\n');gate.classList.remove('good')}
  }catch(e){status.textContent='DIAGNOSTIC ACCESS FAILED: '+(e.stack||e);gate.classList.remove('good')}
 }
 frame.addEventListener('load',()=>{status.textContent='App file loaded. Checking actual launcher visibility…';setTimeout(inspect,800);setTimeout(inspect,2500)});
 frame.addEventListener('error',e=>{status.textContent='IFRAME LOAD ERROR: '+(e.message||'unknown');gate.classList.remove('good')});
 try{
  const j=await readJournal();
  if(j&&j.phase!=='committed'){
   if(!j.oldValues)throw Error('Recovery journal incomplete');
   for(const k of keys)write(k,Object.prototype.hasOwnProperty.call(j.oldValues,k)?j.oldValues[k]:null);
   for(const k of keys)if(localStorage.getItem(k)!==(Object.prototype.hasOwnProperty.call(j.oldValues,k)?j.oldValues[k]:null))throw Error('Rollback read-back mismatch: '+k);
   await clearJournal();status.textContent='Interrupted isolated restore rolled back and verified. Loading app…';
  }else if(j&&j.phase==='committed'){await clearJournal();status.textContent='Committed isolated test restore retained. Loading app…'}
  else status.textContent='No interrupted restore found. Loading isolated app…';
  const vr=await fetch('./version.json?fresh='+Date.now(),{cache:'no-store'});if(!vr.ok)throw Error('version.json unavailable: '+vr.status);
  const vd=await vr.json();if(vd.version!==217||vd.file!=='app-v217.html')throw Error('Expected v217 manifest; received '+JSON.stringify(vd));
  frame.src=vd.file+'?build=217-e&fresh='+Date.now();
 }catch(e){status.textContent='DATA PROTECTION STOP: '+(e.message||e)+'\nNo accounting or project data was cleared.';gate.classList.remove('good')}
})();
</script></body></html>
